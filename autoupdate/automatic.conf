# CapivaraOS Herd — política de atualização automática (dnf5 automatic).
#
# Instalado pelo pacote capivaraos-herd-autoupdate como /etc/dnf/automatic.conf
# (só na 1ª vez — edições do admin persistem; ver PROD-106). O timer
# dnf5-automatic.timer roda `dnf5 automatic --timer` diariamente (~06:00 + delay).
#
# POSTURA (servidor de segurança/compliance): aplica automaticamente as
# atualizações de SEGURANÇA (patch em dia é exigência de várias normas), mas
# NUNCA reinicia sozinho — reboot é decisão do admin / da página de Updates do
# Herd Control (PROD-108). Um kernel novo só passa a valer após o reboot; até lá
# o kernel em execução continua (sem livepatch no Community).
#
# Para MUDAR o comportamento, edite este arquivo:
#   - só baixar, não aplicar:      apply_updates = no
#   - todas as atualizações:       upgrade_type = default
#   - reiniciar quando necessário: reboot = when-needed   (cuidado em servidor)

[commands]
# Só as atualizações de segurança (default | security | distro-sync).
upgrade_type = security
# Baixa e APLICA automaticamente.
download_updates = yes
apply_updates = yes
# Não reiniciar sozinho (servidor). Reboot = decisão do admin/Herd Control.
reboot = never
# Espera a rede ficar on-line (segundos) antes de tentar os repositórios.
network_online_timeout = 60
# Delay extra do próprio dnf (o timer já aplica até 1h de RandomizedDelay).
random_sleep = 0

[emitters]
# Registra o resultado no /etc/motd.d/dnf5-automatic (admin vê no login) e no
# stdout (capturado pelo journald do serviço). Sem e-mail por padrão (headless).
emit_via = motd, stdio
# Também avisa quando não houve novidade (útil p/ auditoria de que rodou).
emit_no_updates = yes

[base]
# Herda o resto do /etc/dnf/dnf.conf (gpgcheck=1 etc.). Não sobrescrever aqui.
