# CapivaraOS HERD — baseline de hardening SSH (PROD-41).
# Fonte ÚNICA: este arquivo é entregue pelo pacote capivaraos-herd-hardening e
# instalado nos DOIS caminhos (qcow2/osbuild e ISO/kickstart). Antes vivia
# duplicado no blueprint e no %post do kickstart.
#
# ATENÇÃO: PasswordAuthentication no exige chave SSH. Na qcow2 o cloud-init
# injeta a chave. No bare-metal (ISO), garanta chave/console antes de expor.
PermitRootLogin no
PasswordAuthentication no
PermitEmptyPasswords no
KbdInteractiveAuthentication no
X11Forwarding no
MaxAuthTries 3
LoginGraceTime 30
AllowAgentForwarding no
# Ciphers/MACs/KEX ficam a cargo das crypto-policies do sistema (já fortes por
# padrão no Fedora) — não hardcodar aqui. AllowTcpForwarding não é desabilitado
# para não quebrar túneis legítimos de administração.
