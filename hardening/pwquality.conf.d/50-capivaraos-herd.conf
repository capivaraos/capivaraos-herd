# CapivaraOS HERD — política de qualidade de senha (PROD-41).
# Lido por libpwquality (pam_pwquality) a partir de /etc/security/pwquality.conf.d/.
# Aplica-se a senhas NOVAS (não invalida senhas já existentes). Perfil "básico"
# do Community; um perfil CIS mais rígido fica para o Enterprise (fase 2).
minlen = 12
minclass = 3
maxrepeat = 3
maxsequence = 3
gecoscheck = 1
dictcheck = 1
