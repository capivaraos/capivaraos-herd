# CapivaraOS HERD — password quality policy.
# Lido por libpwquality (pam_pwquality) a partir de /etc/security/pwquality.conf.d/.
# Aplica-se a senhas NOVAS (não invalida senhas já existentes).
# Para exigências mais rígidas, aplique um perfil com o herd-harden.
minlen = 12
minclass = 3
maxrepeat = 3
maxsequence = 3
gecoscheck = 1
dictcheck = 1
