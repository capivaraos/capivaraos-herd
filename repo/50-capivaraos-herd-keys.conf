# Installed by capivaraos-herd-repos as a drop-in for dnf5-automatic.service.
#
# Makes the Herd signing keys shipped by that package trusted before each
# unattended update: dnf5 automatic cannot answer a key import prompt.
#
# Two separate stores need the keys:
# 1. rpm's keyring, used to verify package signatures. rpm refuses to import
#    a key from a package scriptlet (it cannot take the keyring lock during
#    the transaction), so it is done here. Only these two fixed files are
#    imported; importing a key that is already trusted is a no-op. There is
#    no "-" prefix on purpose: if a key file is missing or unreadable, the
#    whole unattended run stops, Fedora updates included, and the unit is
#    reported as failed.
# 2. dnf5's per-repository key store, used to verify repository metadata
#    (repo_gpgcheck). dnf5 fills it from the gpgkey= files of the repository,
#    here the same two files. Only the two Herd repositories are loaded, so
#    no other repository's key is accepted. This step has a "-" prefix: if it
#    fails (for example because an admin removed the Herd .repo file) and
#    dnf5 has not stored the keys in an earlier run, that run cannot verify
#    the Herd repositories, and Fedora updates still go ahead.
[Service]
ExecStartPre=/usr/bin/rpmkeys --import /etc/pki/rpm-gpg/RPM-GPG-KEY-capivaraos-herd /etc/pki/rpm-gpg/RPM-GPG-KEY-capivaraos-herd-reserve
ExecStartPre=-/usr/bin/dnf5 -y --repo=capivaraos-herd --repo=capivaraos-herd-testing makecache
