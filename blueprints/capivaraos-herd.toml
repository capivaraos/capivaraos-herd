name = "capivaraos-herd"
description = "CapivaraOS HERD Community — servidor headless, base Fedora 44"
version = "1.0.0"

# =============================================================================
# CapivaraOS HERD Community 1.0.0 — blueprint osbuild / Image Builder
# =============================================================================
# Fonte de verdade única do build (ver PROD-40). A partir desta blueprint o
# build.sh produz DUAS imagens:
#   - qcow2            (nuvem/VM, com cloud-init)
#   - image-installer  (ISO instalador headless para bare-metal/VM)
# para x86_64 e aarch64 (um builder osbuild por arquitetura).
#
# HERD 1.x tem base Fedora 44, a MESMA geração dos desktops (Marsh/Pup/Snout
# 1.x = F44) — assim aprendemos com o HERD já agora e lançamos tudo em conjunto.
# O Fedora 45 fica reservado para a GERAÇÃO 2 (HERD 2.x + próxima leva das
# spins), quando o F45 estiver maduro e já teremos ajustes do HERD 1.x pra
# aplicar. Perfil alinhado à PROD-38 (escopo técnico) e PROD-41
# (hardening/compliance).
# =============================================================================

# ── Identidade visual do HERD (RPM próprio) ─────────────────────────────────
# Entra via source customizado do composer apontando SÓ para o RPM correto do
# HERD (ver build.sh e rpm/). Evita puxar branding de outra spin — mesma
# armadilha de NEVRA/SOURCES compartilhados dos desktops (BUG-30).
[[packages]]
name = "capivaraos-herd-branding"
version = "*"

# ── Núcleo de servidor ──────────────────────────────────────────────────────
[[packages]]
name = "cloud-init"
version = "*"

[[packages]]
name = "qemu-guest-agent"
version = "*"

[[packages]]
name = "openssh-server"
version = "*"

[[packages]]
name = "firewalld"
version = "*"

[[packages]]
name = "chrony"
version = "*"

# Cockpit: UI web de administração (serviços, rede, storage, updates, terminal
# no navegador) em https://<ip>:9090. É "a UI" do mundo Fedora Server; entra
# como diferencial amigável da HERD Community e é a rampa para o HERD Control
# futuro. A cockpit.socket é ativada sob demanda (não roda até acessarem a 9090)
# e a porta é liberada no firewalld abaixo.
[[packages]]
name = "cockpit"
version = "*"

# glibc-langpack-pt para que pt_BR.UTF-8 exista na imagem (server mínimo não
# traz todos os langpacks como o glibc-all-langpacks dos lives de desktop).
[[packages]]
name = "glibc-langpack-pt"
version = "*"

[[packages]]
name = "glibc-langpack-en"
version = "*"

# ── Perfil básico de segurança (PROD-41) ────────────────────────────────────
# Entrega SSH endurecido, política de senha (pwquality), umask 027 e o
# herd-compliance-scan (OpenSCAP). Fonte ÚNICA das duas imagens — antes o SSH
# vivia duplicado aqui (customizations.files) e no %post do kickstart. Puxa
# openscap-scanner + scap-security-guide (compliance embarcado no Community).
[[packages]]
name = "capivaraos-herd-hardening"
version = "*"

# =============================================================================
# CUSTOMIZAÇÕES
# =============================================================================
[customizations]
hostname = "capivaraos-herd"

[customizations.locale]
languages = ["pt_BR.UTF-8", "en_US.UTF-8"]
keyboard = "br-abnt2"

[customizations.timezone]
timezone = "America/Sao_Paulo"
ntpservers = ["pool.ntp.br"]

# ── Firewall (hardening, PROD-41) ───────────────────────────────────────────
# Libera SSH + Cockpit (9090). Remove o mdns (descoberta avahi — superfície
# desnecessária num servidor). MANTÉM o dhcpv6-client: é serviço de CLIENTE
# (recebe respostas DHCPv6); removê-lo quebraria o endereçamento IPv6 em redes
# que usam DHCPv6. Resultado da zona public: ssh, cockpit, dhcpv6-client.
[customizations.firewall.services]
enabled = ["ssh", "cockpit"]
disabled = ["mdns"]

# ── Serviços habilitados ────────────────────────────────────────────────────
# cloud-init fica habilitado na base; em bare-metal sem datasource ele
# essencialmente no-opera. Um perfil bare-metal que o desabilite pode vir
# depois (refino da PROD-41).
# NB: no Fedora 44 não existe mais "cloud-init.service" — o pacote orquestra o
# ciclo (local/network/config/final) via cloud-init.target. Habilitar o alvo
# é a forma canônica; pedir "cloud-init" falha ("Unit does not exist").
[customizations.services]
enabled = ["sshd", "firewalld", "chronyd", "cloud-init.target", "cockpit.socket"]

# ── SSH endurecido ──────────────────────────────────────────────────────────
# MOVIDO para o pacote capivaraos-herd-hardening (fonte única; ver seção de
# pacotes acima e PROD-41). Não duplicar aqui: o drop-in
# /etc/ssh/sshd_config.d/50-capivaraos-herd.conf agora vem do RPM.
